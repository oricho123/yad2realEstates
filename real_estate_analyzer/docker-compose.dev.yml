version: "3.8"

services:
  app:
    build:
      context: .
      target: base
    environment:
      - FLASK_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - HOST=0.0.0.0
      - PORT=8051
    volumes:
      - .:/app
      - /app/__pycache__
    ports:
      - "8051:8051"
    command: python cli.py serve --host 0.0.0.0 --port 8051 --debug

  # Remove nginx for development
  nginx:
    profiles: ["production"]
